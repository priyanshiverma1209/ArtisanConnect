<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AI Task Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom StyleSheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">🚀</div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in with your Unique User ID and password</p>
            </div>
            
            <form action="{{ url_for('login') }}" method="POST" class="auth-form" autocomplete="on">
                <!-- Unique User ID -->
                <div class="form-group">
                    <label for="unique_id" class="form-label">Unique User ID</label>
                    <input type="text" id="unique_id" name="unique_id" class="auth-input" placeholder="e.g. ATM-483921" autocomplete="username" value="{{ unique_id or '' }}" required autofocus>
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password" class="form-label">Password</label>
                        <a href="{{ url_for('forgot_password') }}" class="forgot-password-link">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="auth-input" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="password-toggle-btn" data-target="password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="auth-btn" data-loading-text="Signing In...">
                    Sign In
                </button>
            </form>
            
            <div class="auth-footer">
                New user? 
                <a href="{{ url_for('register') }}" class="auth-link">Create Account</a>
            </div>
        </div>
    </div>

    <!-- Flash messages container for toast notifications -->
    <div id="flash-messages" style="display: none;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <span class="flash-message-data" data-category="{{ category }}" data-message="{{ message }}"></span>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Scripting for alerts and validation -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
